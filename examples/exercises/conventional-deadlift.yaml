id: conventional-deadlift
nom: Soulevé de terre conventionnel
nom_en: Conventional deadlift
description: Soulever la barre du sol jusqu'à extension complète. Le roi des mouvements
  composés.
groupe: dos / jambes
muscles_principaux:
- érecteurs du rachis
- ischio-jambiers
- grand fessier
muscles_secondaires:
- quadriceps
- trapèzes
- avant-bras
equipement:
- barbell
- plates
cues:
- Barre contre les tibias au départ, pieds sous la barre
- Dos plat, poitrine sortie, pousser le sol avec les pieds
- Ne JAMAIS arrondir le dos — c'est non négociable
